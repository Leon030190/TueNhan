name: Build Android APK (Godot Engine)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'ios/**'
      - 'tools/build_godot_ios.py'
      - '.github/workflows/build-ios.yml'


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Android Tools Environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "JAVA_HOME=${JAVA_HOME}"
          # Add build-tools to PATH if needed
          BT_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "Latest Build-Tools: ${BT_DIR}"
          if [ -d "${BT_DIR}" ]; then
            echo "${BT_DIR}" >> $GITHUB_PATH
          fi

      - name: Build Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_godot_android.py

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TueNhan-Android-APK
          path: TueNhan.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 TueNhan.apk --clobber
