name: Build Playable iOS IPA (Godot Engine)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Godot iOS Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_godot_ios.py

      - name: Upload Playable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TueNhan-Playable-IPA
          path: TueNhan_Playable.ipa

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 TueNhan_Playable.ipa --clobber
