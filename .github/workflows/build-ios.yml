name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Xcode Project Archive
        run: |
          cd ios
          mkdir -p build
          xcodebuild archive \
            -project TueNhan.xcodeproj \
            -scheme TueNhan \
            -configuration Release \
            -archivePath build/TueNhan.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/TueNhan.xcarchive/Products/Applications/TueNhan.app build/Payload/
          cd build
          zip -r TueNhan.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TueNhan-iOS-IPA
          path: ios/build/TueNhan.ipa
